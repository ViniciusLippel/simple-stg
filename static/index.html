<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #ffffff;
      color: #111111;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top bar */
    #topbar {
      height: 48px;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      flex-shrink: 0;
    }

    #topbar h1 {
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.01em;
    }

    #view-toggle {
      display: flex;
      gap: 2px;
    }

    #view-toggle button {
      background: none;
      border: 1px solid #e0e0e0;
      padding: 5px 12px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      color: #888;
    }

    #view-toggle button.active {
      color: #111;
      border-color: #111;
    }

    /* Body layout */
    #layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Sidebar */
    #sidebar {
      width: 180px;
      flex-shrink: 0;
      border-right: 1px solid #e0e0e0;
      overflow-y: auto;
      padding: 12px 0;
    }

    #sidebar-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #aaa;
      padding: 8px 16px 8px;
      margin-top: 4px;
      border-top: 1px solid #e0e0e0;
    }

    .folder-item {
      display: block;
      width: 100%;
      background: none;
      border: none;
      text-align: left;
      padding: 7px 16px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      color: #444;
    }

    .folder-item:hover { color: #111; }
    .folder-item.active { color: #111; font-weight: 500; }

    #sidebar-empty {
      padding: 8px 16px;
      font-size: 13px;
      color: #aaa;
    }

    /* Main content */
    #main {
      flex: 1;
      overflow-y: auto;
    }

    /* Scroll mode */
    #photos-scroll {
      max-width: 860px;
      margin: 0 auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    #photos-scroll img {
      max-width: 100%;
      max-height: 75vh;
      width: auto;
      display: block;
    }

    /* Mosaic mode */
    #photos-mosaic {
      columns: 3;
      column-gap: 8px;
      padding: 24px 20px;
    }

    @media (max-width: 700px) {
      #photos-mosaic { columns: 2; }
    }

    #photos-mosaic img {
      width: 100%;
      display: block;
      break-inside: avoid;
      margin-bottom: 8px;
    }

    img:hover { opacity: 0.97; }

    /* States */
    #placeholder {
      padding: 48px 20px;
      color: #bbb;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div id="topbar">
  <h1>Gallery</h1>
  <div id="view-toggle">
    <button id="btn-scroll" class="active" onclick="setMode('scroll')">Scroll</button>
    <button id="btn-mosaic" onclick="setMode('mosaic')">Mosaic</button>
  </div>
</div>

<div id="layout">
  <nav id="sidebar">
    <button class="folder-item" id="btn-home" onclick="loadRoot()">Home</button>
    <div id="sidebar-title">Albums</div>
    <div id="folder-list"></div>
  </nav>

  <main id="main">
    <div id="placeholder">Select an album.</div>
    <div id="photos-scroll" style="display:none"></div>
    <div id="photos-mosaic" style="display:none"></div>
  </main>
</div>

<script>
  let currentPhotos = [];
  let currentFolder = null; // null = root
  let mode = 'scroll';

  async function init() {
    const folders = await fetch('/api/folders').then(r => r.json());
    const list = document.getElementById('folder-list');

    list.innerHTML = folders.length === 0
      ? '<div id="sidebar-empty">No albums yet.</div>'
      : folders.map(f =>
          `<button class="folder-item" onclick="loadFolder('${f}')">${f}</button>`
        ).join('');

    loadRoot();
  }

  async function loadRoot() {
    currentFolder = null;

    document.querySelectorAll('.folder-item').forEach(el => el.classList.remove('active'));
    document.getElementById('btn-home').classList.add('active');

    currentPhotos = await fetch('/api/photos').then(r => r.json());
    render();
  }

  async function loadFolder(folder) {
    currentFolder = folder;

    document.getElementById('btn-home').classList.remove('active');
    document.querySelectorAll('#folder-list .folder-item').forEach(el => {
      el.classList.toggle('active', el.textContent === folder);
    });

    currentPhotos = await fetch(`/api/photos/${folder}`).then(r => r.json());
    render();
  }

  function setMode(newMode) {
    mode = newMode;
    document.getElementById('btn-scroll').classList.toggle('active', mode === 'scroll');
    document.getElementById('btn-mosaic').classList.toggle('active', mode === 'mosaic');
    if (currentPhotos.length > 0) render();
  }

  function render() {
    const placeholder = document.getElementById('placeholder');
    const scroll = document.getElementById('photos-scroll');
    const mosaic = document.getElementById('photos-mosaic');

    if (currentPhotos.length === 0) {
      scroll.style.display = 'none';
      mosaic.style.display = 'none';
      placeholder.style.display = 'block';
      placeholder.textContent = currentFolder === null ? 'No photos in root folder.' : 'No photos in this album.';
      return;
    }

    placeholder.style.display = 'none';

    const base = currentFolder === null ? '/photos' : `/photos/${currentFolder}`;
    const imgs = currentPhotos.map(name =>
      `<img src="${base}/${name}" alt="${name}" loading="lazy">`
    ).join('');

    if (mode === 'scroll') {
      scroll.innerHTML = imgs;
      scroll.style.display = 'flex';
      mosaic.style.display = 'none';
    } else {
      mosaic.innerHTML = imgs;
      mosaic.style.display = 'block';
      scroll.style.display = 'none';
    }
  }

  init();
</script>

</body>
</html>
